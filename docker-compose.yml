services:
  # 1. DJANGO APLIKACIJA
  web:
    build: .
    command: sh -c "python manage.py migrate && python create_superuser.py && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - static_volume:/app/staticfiles # Folder gde Django stavlja CSS
      - ./db.sqlite3:/app/db.sqlite3
      - ./uploads:/app/uploads
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1

  # 2. NGINX
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80" # Na kompjuteru otvarate port 8080
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/yum_book/staticfiles:ro # Deljeni folder sa CSS-om
      - ./uploads:/var/www/yum_book/uploads:ro
    depends_on:
      - web

volumes:
  static_volume: # Simulacija PVC-a u Dockeru
